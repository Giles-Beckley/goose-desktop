appId: com.wpgoose.desktop
productName: Goose Commerce
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - resources/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.png
  uninstallerIcon: resources/icon.png
  installerHeaderIcon: resources/icon.png
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.png
  category: public.app-category.business
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
publish:
  provider: github
  owner: your-github-username
  repo: goose-commerce-desktop
