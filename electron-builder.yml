appId: com.wpgoose.desktop
productName: Goose Commerce
asar: true
directories:
  buildResources: resources
  output: release
files:
  - "dist"
  - "!dist/**/*.map"
  - "!**/{.DS_Store,.git,.gitignore}"
extraResources:
  - from: resources/
    to: resources/
    filter:
      - "icon.png"
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: resources/installer.nsh
publish:
  provider: github
  owner: Giles-Beckley
  repo: goose-desktop
  releaseType: release
